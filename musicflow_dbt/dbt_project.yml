
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'musicflow_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'musicflow_dbt'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


version: 2

sources:
  - name: musicflow
    schema: main
    tables:
      - name: fact_streams
        description: "Tabla de hechos raw de reproducciones"
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 24, period: hour}
      - name: dim_user
      - name: dim_track
      - name: dim_artist
      - name: dim_date

models:
  - name: stg_streams
    description: "Streams limpios y estandarizados"
    columns:
      - name: stream_sk
        tests:
          - unique
          - not_null
      - name: listened_seconds
        tests:
          - not_null
      - name: device_type
        tests:
          - accepted_values:
              values: ['mobile', 'desktop', 'tablet', 'smart_tv']

  - name: mart_top_artists
    description: "Reporte analítico final: Top de artistas por horas escuchadas a nivel semanal y regional."
    columns:
      - name: artist_name
        description: "Nombre oficial del artista."
        tests:
          - not_null
      - name: region
        description: "Región o país del usuario al momento del stream."
        tests:
          - not_null
      - name: week
        description: "Semana del año."
        tests:
          - not_null
      - name: year
        description: "Año de la reproducción."
        tests:
          - not_null
      - name: total_hours
        description: "Suma total de horas escuchadas en esa semana y región."
        tests:
          - not_null
      - name: ranking
        description: "Posición del artista en el ranking semanal de su región (1 es el más escuchado)."
        tests:
          - not_null