
version: 2

sources:
  - name: musicflow
   
    database: /storage/musicflow.duckdb
    schema: main
    tables:
      - name: fact_streams
        description: "Tabla de hechos raw de reproducciones"
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 24, period: hour}

models:
  - name: stg_streams
    description: "Streams limpios y estandarizados"
    columns:
      - name: stream_sk
        tests:
          - unique
          - not_null
      - name: listened_seconds
        tests:
          - not_null
      - name: device_type
        tests:
          - accepted_values:
              values: ['mobile', 'desktop', 'tablet', 'smart_tv']

models:
  - name: mart_top_artists
    description: "Reporte analítico final: Top de artistas por horas escuchadas a nivel semanal y regional."
    columns:
      - name: artist_name
        description: "Nombre oficial del artista."
        tests:
          - not_null

      - name: region
        description: "Región o país del usuario."
        tests:
          - not_null

      - name: week
        description: "Semana del año."
        tests:
          - not_null

      - name: year
        description: "Año de la reproducción."
        tests:
          - not_null

      - name: total_hours
        description: "Suma total de horas escuchadas en esa semana y región."
        tests:
          - not_null

      - name: ranking
        description: "Posición del artista en el ranking semanal de su región (1 es el más escuchado)."
        tests:
          - not_null